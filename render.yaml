services:
  # 1. Node.js Express Backend API
  - type: web
    name: attendai-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false # Set via Render Dashboard (e.g. MongoDB Atlas)
      - key: JWT_SECRET
        generateValue: true
      - key: AI_SERVICE_URL
        value: https://attendai-ai.onrender.com

  # 2. Python FastAPI AI Microservice
  - type: web
    name: attendai-ai
    env: python
    plan: free
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_MOCK_MODE
        value: "true"
      - key: PYTHON_VERSION
        value: 3.11.9
